runConfig:
  minInstances: 0
  maxInstances: 2
  cpu: 1
  memoryMiB: 256
  concurrency: 80

env:
  - variable: NEXT_PUBLIC_PROFIL
    value: staging
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_API_URL
    value: https://staging-backend-api-591180749674.europe-west1.run.app/api
    availability:
      - BUILD
      - RUNTIME